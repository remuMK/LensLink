# LensLink — Gradle configuration
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.workers.max=4

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
kotlin.code.style=official

# AGP 9.1 officially recommends compileSdk up to 36; the Compose stack we
# pin (compose 1.12.1 / material3 1.5.0-beta02) is built against 37, so
# compiling against android-37 is intentional — just silence the nag.
android.suppressUnsupportedCompileSdk=37

# AGP 9 opt-outs (temporary — both are removed in AGP 10; migrate the
# project to AGP 9 built-in Kotlin + new DSL before upgrading to 10).
#   builtInKotlin=false -> the org.jetbrains.kotlin.android plugin is
#     applied by the library/app modules (legacy KGP path).
#   newDsl=false        -> required alongside it; the legacy Kotlin
#     plugin is incompatible with the AGP 9 "new DSL".
android.builtInKotlin=false
android.newDsl=false
