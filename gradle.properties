# LensLink — Gradle configuration
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.workers.max=4

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
kotlin.code.style=official

# AGP 9.1 officially recommends compileSdk up to 36; the Compose stack we
# pin (compose 1.12.1 / material3 1.5.0-beta02) is built against 37, so
# compiling against android-37 is intentional — just silence the nag.
android.suppressUnsupportedCompileSdk=37

# AGP 9.1 built-in Kotlin + new DSL (defaults since AGP 9.0 — no
# org.jetbrains.kotlin.android plugin needed; the Compose compiler plugin
# (org.jetbrains.kotlin.plugin.compose) is still applied to modules that
# use Jetpack Compose). With built-in Kotlin the Kotlin jvmTarget defaults
# to android.compileOptions.targetCompatibility. These defaults become
# MANDATORY in AGP 10, so this is also the migration.
